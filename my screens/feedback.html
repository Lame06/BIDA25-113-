<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Feedback | Mega-minds Tuition Center</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
  <link rel="stylesheet" href="../style.css">
  
</head>
<body>
  <header>
    <header class="header">
    <div class="logo">
      <img src="../images/megamind logo.jpg" alt="logo image">
      <p>Mega-minds</p>
    </div>

    <nav class="navbar">
      <ul>
        <li><a href="../index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="courses.html">Courses</a></li>
        <li><a href="resources.html">Resources</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="feedback.html">Feedback</a></li>
      </ul>
    </header>

    
    <main class="section-padding">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="custom-card p-5 shadow">
                        <h2 class="section-title">Feedback Form</h2>
                        <p class="text-center mb-4">We value your opinion. Please share your experience with us.</p>
                        
                        <form action="../index.html" method="GET">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="names" class="form-label">Full Name</label>
                                    <input type="text" class="form-control form-control-custom" id="names" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="phone" class="form-label">Phone Number</label>
                                    <input type="tel" class="form-control form-control-custom" id="phone" required>
                                </div>
                                <div class="col-12">
                                    <label for="email" class="form-label">E-mail</label>
                                    <input type="email" class="form-control form-control-custom" id="email" required>
                                </div>
                                <div class="col-12">
                                    <label for="comment" class="form-label">Your Comment</label>
                                    <textarea class="form-control form-control-custom" id="comment" rows="4" required></textarea>
                                </div>
                                <div class="col-12 mt-4 text-center">
                                    <button type="submit" class="btn btn-primary-custom px-5">Submit Feedback</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <div class="container text-center">
            <div class="footer-info">
                <h3>Mega-minds Tuition Center</h3>
                <p>Empowering young minds for a brighter future.</p>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 Mega-minds Tuition Center. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
